# @package _global_

defaults:
  - /agent/ppo/agent

agent:
  _target_: protomotions.agents.mimic.agent.Mimic
  config:
    # Mimic parameters
    gradient_clip_val: 50.0
    clip_critic_loss: True
    eval_metric_keys: ["cartesian_err", "gt_err", "dv_rew", "kb_rew", "lr_rew", "rv_rew", "rav_rew", "gr_err", "gr_err_degrees"]
    eval_length: null
    eval_num_episodes: 1

    # Early termination
    training_early_termination:
      early_terminate_cart_err: null
      early_terminate_success_rate: null

    # ===> ADD PLR CONFIG HERE <===
    plr:
      enabled: false            # Master switch
      strategy: "value_l1"     # Score calculation: 'value_l1', 'gae_abs'
      ema_alpha: 0.1           # EMA factor for score updates (1.0 = replace)

      # Score-based prioritization (P_S)
      score_transform: "rank"  # 'rank', 'power', 'softmax'
      temperature: 0.1         # Low temp = sharp prioritization

      # Staleness-based prioritization (P_C)
      staleness_coef: 0.3      # Weight for staleness (0 = only score)
      staleness_transform: "rank" # 'rank', 'power', 'softmax'
      staleness_temperature: 1.0 # Usually less sharp
